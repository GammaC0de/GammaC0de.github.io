<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile App Redirector</title>
</head>
<body>
    <p>Opening app, please wait...</p>

    <script type="text/javascript">
        // 1. Grab the client-side secret parameters after the '#'
        const secretFragment = window.location.hash;

        if (secretFragment) {
            // 2. Construct your app's custom intent deep-link
            const appDeepLink = "org.pyload.android.client://addserver?" + secretFragment.substring(1); // Remove the '#' from the fragment

            // 3. Proactively trigger the redirect to your app
            window.location.href = appDeepLink;

            // 4. Fallback: If they don't have the app installed, send them to the releases page after 3 seconds
            setTimeout(() => {
                window.location.href = "https://github.com/pyload/pyload-android/releases/latest";
            }, 3000);
        } else {
            document.body.innerHTML = "<p>Error: No server info provided in the link.</p>";
        }
    </script>
</body>
</html>
